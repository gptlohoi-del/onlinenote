<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghi chú Online</title>
  <!-- Giao diện tối giản với Pico.css -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <main class="container">
    <nav>
      <ul><li><strong>Ghi chú của tôi</strong></li></ul>
    </nav>
    
    <article>
      <header>Thêm nội dung mới</header>
      <form id="addForm">
        <select id="phanLoai" required>
          <option value="" selected disabled>Chọn danh mục...</option>
          <!-- Option sẽ được render bằng JS -->
        </select>
        <input type="text" id="noiDung" placeholder="Nhập nội dung (Không trùng lặp)" required>
        <button type="submit">Lưu lại</button>
      </form>
    </article>

    <div id="danhSachNoidung">
      <!-- Dữ liệu render tại đây -->
      <p aria-busy="true">Đang tải dữ liệu...</p>
    </div>
  </main>

  <script>
    const API_URL = 'URL_WEB_APP_CUA_BAN';

    // Đăng ký Service Worker cho PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(() => console.log('PWA Ready!'));
    }

    // Hàm gọi API đơn giản
    async function loadData() {
      const res = await fetch(`${API_URL}?action=getNoiDung`);
      const data = await res.json();
      
      const html = data.slice(1).map(row => `
        <details>
          <summary>${row[1]} <small>(${row[0]})</small></summary>
          <p>Thời gian ghi: ${row[2]}</p>
        </details>
      `).join('');
      document.getElementById('danhSachNoidung').innerHTML = html;
    }

    loadData();
  </script>
</body>
</html>
